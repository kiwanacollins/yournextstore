services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # postgres only auto-creates POSTGRES_DB on first init — payload gets its own
      # database in the same server, created by this script on that first boot.
      - ./scripts/init-payload-db.sql:/docker-entrypoint-initdb.d/init-payload-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: ./medusa
      dockerfile: apps/backend/Dockerfile
    env_file: ./medusa/apps/backend/.env
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"

  payload:
    build:
      context: ./payload
      dockerfile: Dockerfile.dev
    env_file: ./payload/.env
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/payload
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  redis_data:
